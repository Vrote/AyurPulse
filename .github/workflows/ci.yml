name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx (multi‑platform support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub (replace with your Docker Hub username & password stored as secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the backend image (you can also build the frontend if you want a single image)
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ayurpulse-backend:latest -f Ayurpulse/Dockerfile .

      # Run backend unit tests (assumes you have pytest in requirements)
      - name: Run backend tests
        run: |
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/ayurpulse-backend:latest pytest

      # Push the image to Docker Hub
      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ayurpulse-backend:latest

      # (Optional) Build and push the frontend image similarly
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ayurpulse-frontend:latest -f frontend/Dockerfile .

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ayurpulse-frontend:latest
