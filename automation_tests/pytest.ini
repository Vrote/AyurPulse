[pytest]
addopts = --html=reports/report.html --self-contained-html -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
markers =
    auth: Authentication and registration tests
    patient: Patient workflow tests (scan, quiz, plan generation, shops)
    doctor: Doctor vetting and clinical audit tests
    e2e: Full end-to-end integration tests
